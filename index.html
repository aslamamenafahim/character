  <head>
    <meta charset="UTF-8" />

    <title>2D Walk & Talk Studio - Responsive Animation & AI Avatar</title>
    <meta name="description" content="Fully responsive 2D character walk and talk animation studio with interactive controls, AI speech, and device responsiveness." />
    <meta property="og:title" content="2D Walk & Talk Studio" />
    <meta property="og:description" content="Fully responsive 2D character walk and talk animation studio with interactive controls, AI speech, and device responsiveness." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Fix for browser extensions attempting to monkey-patch window.fetch when it has only a getter
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            }
          });
        } catch (_) {}

        // Suppress external extension errors from breaking the application runtime
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (
              event.filename.indexOf('chrome-extension://') !== -1 ||
              event.filename.indexOf('moz-extension://') !== -1 ||
              event.filename.indexOf('safari-extension://') !== -1
            )) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('fetch of #<Window> which has only a getter') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason && (reason.message || String(reason));
          if (msg && (
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('fetch of #<Window>') !== -1
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>

  </body>
</html>
